# ---------- Server ----------
# Render/Railway inject PORT automatically. Locally it falls back to 5000.
server.port=${PORT:5000}

# ---------- MySQL ----------
# Local default: MySQL on your machine, database "stocker" (auto-created).
# For a cloud DB (e.g. Aiven) set DB_URL / DB_USER / DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stocker?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Free cloud databases have tiny connection limits - keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Tables are created/updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- App settings ----------
app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying-please}
# Comma separated list of allowed frontend origins (wildcards allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
# Optional: auto-create an admin account on startup
app.admin.email=${ADMIN_EMAIL:admin@stocker.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Keep memory use low (free hosting gives ~512 MB)
spring.main.banner-mode=off
server.compression.enabled=true
